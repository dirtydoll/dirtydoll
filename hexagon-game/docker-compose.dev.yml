version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hexagon_postgres
    environment:
      POSTGRES_DB: hexagon_game
      POSTGRES_USER: hexagon_user
      POSTGRES_PASSWORD: hexagon_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hexagon_backend
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://hexagon_user:hexagon_password@postgres:5432/hexagon_game
      - JWT_SECRET=your_super_secret_jwt_key_here_change_for_production
      - NODE_ENV=development
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
    command: [
      "/wait-for-it.sh",
      "postgres:5432",
      "--",
      "npm",
      "run",
      "dev"
    ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hexagon_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
      - NODE_ENV=development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/package.json:/app/package.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
    command: [
      "/wait-for-it.sh",
      "backend:5000",
      "--",
      "npm",
      "run",
      "dev"
    ]

volumes:
  postgres_data:

networks:
  default:
    driver: bridge